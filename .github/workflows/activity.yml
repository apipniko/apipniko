name: Daily activity log

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write today's entry
        run: python3 .github/scripts/activity.py

      - name: Commit and push
        run: |
          git config user.name "apipniko"
          git config user.email "apipniko@users.noreply.github.com"
          git add activity.log README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(activity): $(date -u +'%Y-%m-%d')"
          git push
